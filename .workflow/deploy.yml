# DayBook 自动部署流水线
#
# 设计要点：
#   Gitee Go 云端构建器是 CentOS 7.6 + Node 8~15，跑不动本项目（要求 Node >= 22.6）。
#   因此云端只做「触发」，真正的构建与部署在主机组（121.89.86.53）本机执行，
#   脚本见仓库根目录 deploy.sh。
#
# 启用前置条件（在 Gitee 网页端完成）：
#   1. 仓库页 →「流水线」→ 开通 Gitee Go（需账号绑定手机号）
#   2. 主机管理 → 新建主机组（公网主机）→ 添加 121.89.86.53 → 按页面命令安装 Agent
#   3. 把下面 hostGroupID 换成你实际的主机组标识（见主机组详情页）

version: '1.0'
name: deploy
displayName: 部署 DayBook 到生产

triggers:
  trigger: auto
  push:
    branches:
      include:
        - master

stages:
  - name: deploy
    displayName: 服务器构建并部署
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: deploy_shell
        displayName: 执行 deploy.sh
        hostGroupID: daybook-prod
        script:
          - set -e
          - bash /opt/daybook/daybook/deploy.sh
        strategy:
          retry: '0'
